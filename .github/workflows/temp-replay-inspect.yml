name: Temporary replay inspect
on:
  push:
    branches:
      - ci/replay-1580957-inspect
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public replay
        run: |
          curl -fsSL --max-time 25 -o /tmp/hanabi-replay.json 'https://hanab.live/export/1580957'
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/hanabi-replay.json'))
          print('initial_hands:', [[(o,d['deck'][o]) for o in range(i*5,(i+1)*5)] for i in range(3)])
          print('actions_0_14:', [(i+1, d['players'][i%3] if i%3<len(d['players']) else '', a, d['deck'][a['target']] if a['type'] in (0,1) else None) for i,a in enumerate(d['actions'][:14])])
          print('type:',type(d).__name__)
          if isinstance(d,dict):
              print('keys:',list(d))
              for k,v in d.items():
                  if isinstance(v,list):print(k,'length',len(v),'first',str(v[:2])[:450])
                  else:print(k,str(v)[:260])
          PY
