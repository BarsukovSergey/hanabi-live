name: Sudoku 3040 export diagnostic

on:
  push:
    paths:
      - ".github/workflows/diagnose-sudoku-3040.yml"

permissions:
  contents: read

jobs:
  fetch-public-game:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve public replay export
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen
          url = "https://hanab.live/export/1663033"
          try:
              req = Request(url, headers={"User-Agent": "Hanabi-Live regression diagnostic"})
              with urlopen(req, timeout=35) as response:
                  raw = response.read(250000)
                  print("HTTP_STATUS", response.status, "BYTES", len(raw))
                  data = json.loads(raw)
              clean = {
                  "players": ["Player" + str(i) for i, _ in enumerate(data.get("players", []))],
                  "deck": data.get("deck", []),
                  "actions": data.get("actions", []),
                  "options": data.get("options", {}),
                  "notes": [],
                  "seed": data.get("seed", ""),
              }
              print("EXPORT_DATA_BEGIN")
              print(json.dumps(clean, separators=(",", ":")))
              print("EXPORT_DATA_END")
              print("TOTAL_ACTIONS", len(clean["actions"]), "TOTAL_DECK", len(clean["deck"]))
          except Exception as exc:
              print("EXPORT_FAILED", type(exc).__name__, str(exc))
              raise
          PY
