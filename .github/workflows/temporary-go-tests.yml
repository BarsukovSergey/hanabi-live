name: Temporary Go unit tests

on:
  push:
    branches:
      - ci/empty-replay-go-tests

jobs:
  go_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Full Go unit test suite
        working-directory: server/src
        run: go test -count=1 ./...
