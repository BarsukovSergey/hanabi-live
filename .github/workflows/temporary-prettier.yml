name: Temporary prettier inspect
on:
  push:
    branches:
      - ci/browser-nav-prettier
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/setup
      - run: |
          npx prettier --write packages/client/src/main.ts
          git diff -- packages/client/src/main.ts
