name: Temporary formatting diagnostic
on:
  push:
    branches:
      - ci/history-format-check
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/setup
      - run: |
          npx prettier --write packages/client/src/lobby/url.test.ts
          git diff -- packages/client/src/lobby/url.test.ts
