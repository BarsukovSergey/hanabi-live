name: Temporary sound formatting
on:
  push:
    branches:
      - ci/sound-pipeline-format
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/setup
      - run: |
          npx prettier --write packages/client/src/game/ui/reactive/views/soundView.test.ts
          git diff -- packages/client/src/game/ui/reactive/views/soundView.test.ts
