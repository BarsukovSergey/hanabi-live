name: Temporary formatting diff
on:
  push:
    branches:
      - ci/ocm-snapshot-prettier
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/workflows/setup
      - run: |
          npx prettier --write packages/client/src/game/ui/reactive/getSoundType.test.ts
          git diff -- packages/client/src/game/ui/reactive/getSoundType.test.ts
